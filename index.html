<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiosTeHabla — Cuéntanos tu corazón</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#D4A843; --gold2:#E8C055;
  --gold-soft:rgba(212,168,67,0.11); --gold-border:rgba(212,168,67,0.22);
  --bg:#1A1A1A; --bg2:#222222; --bg3:#2A2A2A;
  --white:#FFFFFF; --cream:#F5EDD8;
  --mid:rgba(255,255,255,0.72); --muted:rgba(255,255,255,0.45);
  --border:rgba(255,255,255,0.09);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--white);
  font-family:'Inter',sans-serif;font-weight:300;
  min-height:100vh;overflow-x:hidden;
  display:flex;flex-direction:column;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.6;
}

/* ── TOP BAR + PROGRESS ── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(26,26,26,0.94);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:640px;margin:0 auto;
  display:flex;align-items:center;gap:14px;
  padding:16px 24px 14px;
}
.back-btn{
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:20px;line-height:1;padding:4px 6px;transition:color .2s;
  opacity:1;
}
.back-btn:hover{color:var(--white);}
.back-btn.hidden{visibility:hidden;}
.logo{
  display:flex;align-items:center;gap:8px;
  font-family:'Playfair Display',serif;font-size:17px;letter-spacing:.03em;
  color:var(--white);white-space:nowrap;
}
.logo em{font-style:normal;color:var(--gold);}
.progress-wrap{flex:1;height:4px;background:rgba(255,255,255,0.08);overflow:hidden;border-radius:2px;}
.progress-bar{position:relative;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .55s cubic-bezier(.4,0,.2,1);overflow:hidden;border-radius:2px;box-shadow:0 0 12px rgba(212,168,67,.4);}
.progress-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 2.4s ease-in-out infinite;}
@keyframes shimmer{0%{transform:translateX(-120%);}60%,100%{transform:translateX(320%);}}
.step-count{font-family:'Playfair Display',serif;font-size:14px;color:var(--gold);white-space:nowrap;min-width:48px;text-align:right;font-variant-numeric:tabular-nums;}

/* ── STAGE ── */
.stage{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:110px 24px 60px;position:relative;z-index:1;
}
.card{
  width:100%;max-width:560px;
}
.step{display:none;}
.step.active{display:block;}
/* entrada en cascada: cada elemento aparece en secuencia (both = mantiene visible al terminar) */
.step.active > *{animation:riseIn .55s cubic-bezier(.16,1,.3,1) both;}
.step.active > *:nth-child(1){animation-delay:.04s;}
.step.active > *:nth-child(2){animation-delay:.12s;}
.step.active > *:nth-child(3){animation-delay:.20s;}
.step.active > *:nth-child(4){animation-delay:.28s;}
.step.active > *:nth-child(5){animation-delay:.36s;}
.step.active > *:nth-child(6){animation-delay:.44s;}
.step.active > *:nth-child(7){animation-delay:.50s;}
@keyframes riseIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
/* pills entran en cascada dentro del grupo */
.pills .pill{animation:riseIn .5s cubic-bezier(.16,1,.3,1) both;}
.pills .pill:nth-child(1){animation-delay:.30s;}
.pills .pill:nth-child(2){animation-delay:.36s;}
.pills .pill:nth-child(3){animation-delay:.42s;}
.pills .pill:nth-child(4){animation-delay:.48s;}
.pills .pill:nth-child(5){animation-delay:.54s;}
.pills .pill:nth-child(6){animation-delay:.60s;}
.pills .pill:nth-child(7){animation-delay:.66s;}

.eyebrow{
  font-size:10px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;
  color:var(--gold);opacity:.7;margin-bottom:18px;
}
.q-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(26px,4.4vw,38px);font-weight:400;line-height:1.12;
  letter-spacing:-.01em;margin-bottom:12px;
}
.q-title em{font-style:italic;color:var(--gold);}
.q-help{font-size:14px;color:var(--mid);line-height:1.6;margin-bottom:28px;max-width:460px;}
.q-help .opt{color:var(--muted);}

/* pills */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.pill{
  padding:11px 18px;border:1px solid var(--border);background:transparent;
  color:var(--mid);font-family:'Inter',sans-serif;font-size:14px;font-weight:300;
  cursor:pointer;transition:transform .15s cubic-bezier(.16,1,.3,1),border-color .15s,color .15s,background .15s;text-align:left;
}
.pill:hover{border-color:var(--gold-border);color:var(--white);transform:translateY(-2px);}
.pill:active{transform:scale(.96);}
.pill.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);animation:pop .32s ease;}
.pill.on::before{content:'✓ ';color:var(--gold);font-weight:600;}
@keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.07);}100%{transform:scale(1);}}

/* text inputs */
.ta{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  padding:14px 16px;font-family:'Inter',sans-serif;font-size:15px;color:var(--white);
  resize:none;outline:none;min-height:96px;line-height:1.6;transition:border-color .2s;
}
.ta:focus{border-color:var(--gold-border);}
.ta::placeholder{color:rgba(255,255,255,.22);}
.f-input{
  width:100%;background:var(--bg3);border:1px solid var(--gold-border);
  padding:16px 18px;font-family:'Inter',sans-serif;font-size:16px;color:var(--white);
  outline:none;transition:border-color .2s;
}
.f-input:focus{border-color:var(--gold);}
.f-input::placeholder{color:rgba(255,255,255,.26);}

/* continue button */
.actions{display:flex;align-items:center;gap:16px;margin-top:26px;}
.btn{
  background:var(--gold);color:var(--bg);border:none;
  padding:15px 34px;font-family:'Inter',sans-serif;
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;transition:background .2s,transform .15s cubic-bezier(.16,1,.3,1),box-shadow .2s;
}
.btn:hover:not(:disabled){background:var(--gold2);transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,168,67,.28);}
.btn:active:not(:disabled){transform:translateY(0) scale(.98);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.skip{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;transition:color .2s;}
.skip:hover{color:var(--mid);}
.hint{font-size:12px;color:var(--muted);margin-top:14px;}
.err{display:none;margin-top:14px;padding:11px 15px;border-left:2px solid #c05050;background:rgba(192,80,80,.08);font-size:13px;color:#e08080;}
.err.on{display:block;}

/* pantalla del versículo (intermedia, como los micro-mensajes) */
.vs-text{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(22px,3.8vw,30px);line-height:1.45;color:var(--cream);
  max-width:480px;margin:0 auto 16px;
}
.vs-cite{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}

/* micro-message screens */
.msg{text-align:center;padding:20px 0;}
.msg-mark{font-size:34px;color:var(--gold);margin-bottom:20px;opacity:.9;animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.97);}50%{opacity:1;transform:scale(1.03);}}
.msg-text{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(20px,3.4vw,27px);line-height:1.45;color:var(--white);
  max-width:440px;margin:0 auto 8px;
}
.msg-sub{font-size:14px;color:var(--muted);margin-top:14px;}

/* loading (final) */
.load{display:none;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:20px;}
.load.on{display:flex;}
.load-cross{font-size:44px;color:var(--gold);animation:pulse 1.7s ease-in-out infinite;}
.load-txt{font-family:'Playfair Display',serif;font-size:18px;font-style:italic;color:var(--mid);}
.load-txt2{font-size:13px;color:var(--muted);}

@media(prefers-reduced-motion:reduce){
  .step.active > *,.pills .pill{animation:none;opacity:1;}
  .msg-mark,.load-cross,.progress-bar::after,.pill.on{animation:none;}
  .progress-bar{transition:none;}
  .pill:hover,.btn:hover:not(:disabled){transform:none;}
}
@media(max-width:520px){
  .topbar-inner{padding:14px 16px 12px;gap:10px;}
  .logo{font-size:15px;}
  .stage{padding:96px 18px 48px;}
  .actions{flex-direction:column;align-items:stretch;}
  .btn{width:100%;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <button class="back-btn hidden" id="backBtn" onclick="back()" aria-label="Volver">←</button>
    <span class="logo">Dios<em>Te</em>Habla</span>
    <div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>
    <span class="step-count" id="stepCount"></span>
  </div>
</div>

<div class="stage">
  <div class="card" id="card"><!-- steps render here --></div>

</div>

  { type:'pills_text', key:'miedo', eyebrow:'Con confianza', title:'¿Qué <em>miedo</em> o herida cargas hoy?',

];

  'fuerzas para seguir':{t:'Los que esperan a Jehová tendrán nuevas fuerzas; correrán, y no se cansarán.',c:'Isaías 40:31'},
  'una señal':{t:'Muéstrame, oh Jehová, tus caminos; enséñame tus sendas.',c:'Salmos 25:4'},
  'provisión económica':{t:'Mirad las aves del cielo; vuestro Padre celestial las alimenta.',c:'Mateo 6:26'},
  'sanidad':{t:'Yo haré venir sanidad para ti, y sanaré tus heridas.',c:'Jeremías 30:17'},
  'más fe':{t:'Creo; ayuda mi incredulidad.',c:'Marcos 9:24'},
  // espera
  'que me dé una señal':{t:'Encamíname en tu verdad, y enséñame.',c:'Salmos 25:5'},
  'que abra un camino':{t:'Otra vez abriré camino en el desierto, y ríos en la soledad.',c:'Isaías 43:19'},
  'que sane mi corazón':{t:'Él sana a los quebrantados de corazón, y venda sus heridas.',c:'Salmos 147:3'},
  'que me dé fuerzas':{t:'Todo lo puedo en Cristo que me fortalece.',c:'Filipenses 4:13'},
  'que cambie mi situación':{t:'A los que aman a Dios, todas las cosas les ayudan a bien.',c:'Romanos 8:28'},
  'que esté conmigo':{t:'He aquí yo estoy con vosotros todos los días.',c:'Mateo 28:20'}
};

/* ---------- render ---------- */
let idx = 0;
const card = document.getElementById('card');
const progressEl = document.getElementById('progress');
const stepCountEl = document.getElementById('stepCount');
const backBtn = document.getElementById('backBtn');

// pasos que cuentan como "pregunta" para el progreso (excluye mensajes)
const questionSteps = steps.filter(s=>s.type!=='message').length;
function questionIndex(i){ return steps.slice(0,i+1).filter(s=>s.type!=='message').length; }

// barra + porcentaje animado
let lastPct = 0;
function setProgress(pct){
  progressEl.style.width = pct+'%';
  const start=lastPct, t0=performance.now();
  (function tick(t){
    const k=Math.min((t-t0)/550,1);
    stepCountEl.textContent = Math.round(start+(pct-start)*k)+'%';
    if(k<1) requestAnimationFrame(tick);
  })(t0);
  lastPct=pct;
}

function render(){
  const s = steps[idx];
  backBtn.classList.toggle('hidden', idx===0);

  if(s.type==='message'){
    setProgress(Math.round(questionIndex(idx)/questionSteps*100));
    card.innerHTML = `
      <div class="step active">
        <div class="msg">
          <div class="msg-mark">${s.mark||'✦'}</div>
          <div class="msg-text">${s.text}</div>
          <div class="msg-sub">${s.sub||''}</div>
          <div class="actions" style="justify-content:center;">
            <button class="btn" onclick="next()">Continuar</button>
          </div>
        </div>
      </div>`;
    return;
  }

  const qn = questionIndex(idx);
  setProgress(Math.round(qn/questionSteps*100));

  let inner = `<div class="eyebrow">${s.eyebrow||''}</div>
    <div class="q-title">${s.title}</div>
    ${s.help?`<div class="q-help">${s.help}</div>`:''}`;

  if(s.type==='pills' || s.type==='pills_text'){
    inner += `<div class="pills">`;
    s.options.forEach(([val,label],k)=>{
      const on = state[s.key]===val ? 'on':'';
      const auto = (s.autoNext && !s.verse) ? true : false;
      inner += `<button class="pill ${on}" data-v="${val}" onclick="pickPill('${s.key}',this,${auto})">${label}</button>`;
    });
    inner += `</div>`;
  }
  if(s.type==='pills_text'){
    inner += `<textarea class="ta" id="taField" placeholder="${s.placeholder||''}" oninput="state['${s.key}']=this.value">${state[s.key]&&!s.options.some(o=>o[0]===state[s.key])?state[s.key]:''}</textarea>`;
  }
  if(s.type==='text'){
    inner += `<input class="f-input" id="txtField" type="text" placeholder="${s.placeholder||''}" value="${state[s.key]||''}" oninput="state['${s.key}']=this.value" onkeydown="if(event.key==='Enter')next()"/>`;
  }
  if(s.type==='email'){
    inner += `<input class="f-input" id="emailField" type="email" placeholder="${s.placeholder||''}" value="${state[s.key]||''}" oninput="state['${s.key}']=this.value" onkeydown="if(event.key==='Enter')generar()"/>`;
  }

  // acciones: mostrar botón Continuar si NO es una pura pill de auto-avance
  const showContinue = (s.type!=='pills') || s.verse;
  if(showContinue){
    const isEmail = s.type==='email';
    inner += `<div class="actions">
      <button class="btn" onclick="${isEmail?'generar()':'next()'}">${isEmail?'Recibir mi Palabra ✝':'Continuar'}</button>
      ${s.optional?`<button class="skip" onclick="skip()">Prefiero saltar esto</button>`:''}
    </div>`;
  }

  inner += `<div class="err" id="errMsg"></div>`;
  card.innerHTML = `<div class="step active">${inner}</div>`;

  // autofocus
  const f = document.getElementById('txtField')||document.getElementById('emailField');
  if(f) setTimeout(()=>f.focus(),120);
}

function pickPill(key,btn,auto){
  const group = btn.parentElement;
  group.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  state[key]=btn.dataset.v;
  const ta=document.getElementById('taField');
  if(ta) ta.value='';           // si eligió pill, limpiamos el texto libre
  if(auto) setTimeout(next,260);
}

function validate(){
  const s=steps[idx];
  if(s.type==='text' && s.key==='nombre'){
    if(!state.nombre.trim()){showErr('Dime tu nombre para empezar.');return false;}
  }
  if(s.type==='pills' && s.verse && !s.optional){
    if(!state[s.key]){showErr('Elige una opción para continuar.');return false;}
  }
  if(s.type==='pills_text' && !s.optional){
    if(!state[s.key] || !state[s.key].trim()){showErr('Elige una opción o cuéntamelo con tus palabras.');return false;}
  }
  if(s.type==='email'){
    if(!state.email || !state.email.includes('@')){showErr('Ingresa un email válido para enviarte tu palabra.');return false;}
  }
  return true;
}

let verseActive=false;
function next(){
  if(!validate()) return;
  const s=steps[idx];
  // si esta pregunta tiene versículo para la respuesta elegida, mostrar la pantalla del versículo primero
  if(s.verse && !verseActive){
    const v = versiculos[state[s.key]];
    if(v){ showVerseScreen(v); return; }
  }
  verseActive=false;
  if(idx < steps.length-1){ idx++; render(); }
}
function showVerseScreen(v){
  verseActive=true;
  backBtn.classList.add('hidden');
  card.innerHTML = `
    <div class="step active">
      <div class="msg">
        <div class="msg-mark">✦</div>
        <div class="vs-text">“${v.t}”</div>
        <div class="vs-cite">${v.c}</div>
        <div class="actions" style="justify-content:center;">
          <button class="btn" onclick="next()">Continuar</button>
        </div>
      </div>
    </div>`;
}
function back(){ verseActive=false; if(idx>0){ idx--; render(); } }
function skip(){ verseActive=false; const s=steps[idx]; if(s.key) state[s.key]=''; if(idx<steps.length-1){idx++;render();} }
function showErr(m){const e=document.getElementById('errMsg');if(e){e.textContent=m;e.classList.add('on');}}

/* ---------- generar carta (mismo backend que index) ---------- */
async function generar(){
  if(!validate()) return;
  const nombre = state.nombre.trim() || 'amigo/a';
  const religion = state.religion;
  const email = state.email.trim();

  // ocultar card, mostrar loading
  document.getElementById('card').style.display='none';
  document.getElementById('loadWrap').classList.add('on');

  const hoy=new Date();
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  const saludo = state.genero==='hombre' ? 'Querido' : state.genero==='mujer' ? 'Querida' : 'Querido/a';
  const generoTxt = state.genero==='hombre' ? 'hombre' : state.genero==='mujer' ? 'mujer' : 'no especificado';

  const info = `INFORMACIÓN DE ${nombre.toUpperCase()}:
- Género: ${generoTxt}
- Etapa de vida: ${state.etapa||'No lo dijo, pero Dios conoce su camino'}
- Con quién comparte su vida: ${state.conQuien||'No lo dijo'}
- Hijos: ${state.hijos||'No lo dijo'}
- Lo más difícil de su semana: ${state.dificil||'No lo mencionó, pero Dios lo sabe'}
- Un sueño o anhelo aún no cumplido: ${state.sueno||'No lo dijo'}
- Un miedo o herida que carga: ${state.miedo||'No lo dijo'}
- Cómo describe su relación con Dios: ${state.relacionDios||'No lo dijo'}
- Lo que le pide a Dios esta semana: ${state.pide||'No lo mencionó, pero Dios lo ve'}
- Lo que espera que Dios haga por él/ella: ${state.espera||'No lo dijo'}`;

  const prompt=`Eres Jesús mismo, y le hablas directamente a ${nombre} en una carta. No eres un narrador ni un predicador que habla DE Dios: eres Tú, en primera persona, dirigiéndote a esta persona de fe ${religion} que amas.

Esto es lo que ${nombre} te ha confiado hoy:

${info}

PRIMERO, PIENSA (no escribas este análisis, solo deja que dé forma a la carta):
Lee TODO lo que compartió como un solo cuadro, no como una lista de respuestas. Pregúntate: ¿qué está viviendo de verdad esta persona, por debajo de las palabras? ¿Cuál es el hilo profundo que une su etapa, su miedo, su sueño, lo que pide y lo que espera? Casi siempre hay una sola raíz —un anhelo, una herida, una pregunta sin nombre— de la que brota todo lo demás. Encuéntrala tú, con la sabiduría de quien conoce el corazón. Esa comprensión, a la que ${nombre} llegó sin darse cuenta, será el corazón de la carta.

LUEGO ESCRIBE la carta entera desde esa comprensión:
- Habla como hablaría Jesús: con ternura y con autoridad serena. Sin prisa. Sin explicarte de más. Afirmas, no argumentas. A veces una frase corta y cierta pesa más que un párrafo entero.
- Integra TODO lo que confió —su etapa, con quién vive, sus hijos, su sueño, su miedo, su relación contigo, lo que pide y lo que espera— pero tejido a través de esa raíz que encontraste. Nunca dato por dato, nunca en el orden en que lo dijo, nunca como un resumen de sus respuestas. Que sienta que entendiste su vida entera, no que repasaste su formulario.
- Dile algo que no esperaba oír. Detente en un solo detalle pequeño y dale la vuelta. Nombra con delicadeza lo que no se atrevió a decir en voz alta.
- Un solo versículo bíblico REAL, con su referencia exacta, entrado con naturalidad dentro de tu voz —como algo que dices Tú ahora, no como una cita que anuncias y explicas. Dale un sentido que ${nombre} no había visto antes.
- Usa el género correcto en todo el texto (si es mujer: Querida, hija, sola, amada; si es hombre: Querido, hijo, solo, amado). Usa su nombre solo donde caiga natural, sin forzarlo.

EVITA (todo esto delata una fórmula y suena a máquina):
- Aperturas gastadas: "He visto tus noches", "Sé lo que estás viviendo", "Dios te ama", "Hijo mío".
- Muletillas de transición: "déjame tocar...", "y ahora...", "quiero dejarte hoy...", "escucha bien".
- Repasar sus respuestas una por una, cada tema en su propio párrafo ordenado.
- Amontonar metáforas gastadas (el río, el agua, la luz, el camino todos juntos). Si usas una imagen, elige una sola y sostenla.

FORMATO DE SALIDA (respétalo al pie de la letra, sin títulos ni asteriscos ni markdown):

${saludo} ${nombre},

El cuerpo de la carta, entre 500 y 700 palabras, en texto corrido y en varios párrafos que fluyan con naturalidad (no numerados, no rotulados). En algún momento debe haber una oración íntima —unas líneas donde te diriges al Padre junto a ${nombre}, cerrando en "Amén."— pero que nazca del hilo de la carta, no como un bloque separado pegado al final. El cierre debe dejar a ${nombre} sabiendo que no camina solo/a esta semana, sin frases de tarjeta.

— Con amor eterno, DiosTeHabla

✦ Tu oración para cada día ✦
${dias[(hoy.getDay()+1)%7]}: "[versículo REAL corto]" — [declaración de fe de 15-20 palabras en presente, específica para lo que vive ${nombre}]
${dias[(hoy.getDay()+2)%7]}: "[versículo REAL corto]" — [declaración de fe de 15-20 palabras en presente]
${dias[(hoy.getDay()+3)%7]}: "[versículo REAL corto]" — [declaración de fe de 15-20 palabras en presente]
${dias[(hoy.getDay()+4)%7]}: "[versículo REAL corto]" — [declaración de fe de 15-20 palabras en presente]
${dias[(hoy.getDay()+5)%7]}: "[versículo REAL corto]" — [declaración de fe de 15-20 palabras en presente]
${dias[(hoy.getDay()+6)%7]}: "[versículo REAL corto]" — [declaración de fe de 15-20 palabras en presente]

REGLAS ABSOLUTAS:
- Todos los versículos 100% reales y con su referencia exacta.
- Empieza el cuerpo exactamente con "${saludo} ${nombre}," y termina el cuerpo exactamente con "— Con amor eterno, DiosTeHabla".
- Nada genérico: cada línea nace de lo que ${nombre} confió.
- Que no se note ninguna fórmula ni estructura. Que se lea como una carta viva, escrita por alguien que conoce a ${nombre} y lo/la ama de verdad.
- Solo texto corrido, sin títulos, sin asteriscos, sin markdown.`;

  // situación limpia y rica para el Sheet (reutilizable en la carta semanal)
  const situacion = `Género: ${state.genero||'—'} | Etapa: ${state.etapa||'—'} | Con quién: ${state.conQuien||'—'} | Hijos: ${state.hijos||'—'} | Difícil: ${state.dificil||'—'} | Sueño: ${state.sueno||'—'} | Miedo/herida: ${state.miedo||'—'} | Relación con Dios: ${state.relacionDios||'—'} | Pide: ${state.pide||'—'} | Espera: ${state.espera||'—'}`;

  const sorteoNum='#'+Math.floor(1000+Math.random()*9000);
  try{
    const res=await fetch('/.netlify/functions/carta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,nombre,email,sorteo:sorteoNum,situacion})});
    const data=await res.json();
    const carta=data.carta||'';if(!carta)throw new Error();
    sessionStorage.setItem('cf_carta',carta);sessionStorage.setItem('cf_nombre',nombre);
    sessionStorage.setItem('cf_email',email);sessionStorage.setItem('cf_sorteo',sorteoNum);
    sessionStorage.setItem('cf_price','$20/mes');sessionStorage.setItem('cf_brand','DiosTeHabla');
    window.location.href='diostehabla-final-page2.html';
  }catch(e){
    document.getElementById('loadWrap').classList.remove('on');
    document.getElementById('card').style.display='block';
    showErr('Hubo un problema. Por favor intenta de nuevo.');
  }
}

render();
</script>
